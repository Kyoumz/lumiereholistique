<div class="actions">
  <h2>Actions rapides</h2>
  <button><a href="/">Acceuil</a></button> 
  <button><a href="/creeRdv">Créer RDV</a></button>
  <button><a href="/creeArticle">Créer Article</a></button>
  <button><a href="/creeFormation">Créer Formation</a></button>
  <button><a href="/creeAnnuaire">Créer Annuaire</a></button>
  <button><a href="/creeVideoPodcast">Créer Vidéo/Podcast</a></button>
  <button><a href="/admin">Admin</a></button>
</div>

<form [formGroup]="videoPodcastForm" (ngSubmit)="submitForm()" enctype="multipart/form-data">
  <label for="title">Titre</label>
  <input id="title" formControlName="title" type="text" required />

  <label for="description">Description</label>
  <textarea id="description" formControlName="description" required></textarea>

  <label for="themes">Thèmes</label>
  <input id="themes" formControlName="themes" type="text" placeholder="Ex : santé, éducation" />

  <label for="file">Vidéo ou Podcast</label>
  <input id="file" type="file" (change)="onFileSelected($event)" accept="video/*,audio/*" required />

  <button type="submit">Ajouter</button>

  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</form>
