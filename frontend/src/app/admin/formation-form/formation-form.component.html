<div class="container">
  <h2>Ajouter une Formation</h2>

  <form [formGroup]="formationForm" (ngSubmit)="submitForm()">
    <label for="title">Titre:</label>
    <input
      id="title"
      formControlName="title"
      required
      placeholder="Titre de la formation"
    />
    <div *ngIf="formationForm.get('title')?.invalid && formationForm.get('title')?.touched" class="error">
      Le titre est requis.
    </div>

    <label for="description">Description:</label>
    <textarea
      id="description"
      formControlName="description"
      placeholder="Courte description"
    ></textarea>

    <label for="content">Contenu:</label>
    <textarea
      id="content"
      formControlName="content"
      required
      placeholder="Contenu de la formation"
    ></textarea>
    <div *ngIf="formationForm.get('content')?.invalid && formationForm.get('content')?.touched" class="error">
      Le contenu est requis.
    </div>

    <label for="image">Image:</label>
    <input
      type="file"
      id="image"
      (change)="onImageSelected($event)"
    />
    <div *ngIf="imagePreview" class="image-preview">
      <img [src]="imagePreview" alt="Aperçu de l'image" />
    </div>
    
    <h3>Chapitres</h3>
<div formArrayName="chapters">
  <div *ngFor="let chapter of chapters.controls; let i = index" [formGroupName]="i" class="chapter-block">
    <label>Titre du chapitre</label>
    <input type="text" formControlName="title" placeholder="Titre du chapitre" />

    <label>Description</label>
    <textarea formControlName="description" placeholder="Description"></textarea>

    <label>Vidéo</label>
    <input type="file" (change)="onVideoSelected($event, i)" />

    <button type="button" (click)="removeChapter(i)">Supprimer</button>
    <hr />
  </div>
</div>

<button type="button" (click)="addChapter()">+ Ajouter un chapitre</button>









    <label for="price">Prix:</label>
    <input
      id="price"
      formControlName="price"
      type="number"
      required
      placeholder="0"
    />
    <div *ngIf="formationForm.get('price')?.invalid && formationForm.get('price')?.touched" class="error">
      Le prix est requis.
    </div>




    <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <button type="submit" [disabled]="formationForm.invalid">Ajouter</button>
  </form>
</div>
