<app-header></app-header>

<div class="container">
  <h2>Ajouter une personne à l’annuaire</h2>

  <form [formGroup]="directoryForm" (ngSubmit)="submitForm()">
    <label for="name">Nom :</label>
    <input id="name" formControlName="name" required placeholder="Nom complet" />
    <div *ngIf="directoryForm.get('name')?.invalid && directoryForm.get('name')?.touched" class="error">
      Le nom est requis.
    </div>

    <label for="description">Description :</label>
    <textarea id="description" formControlName="description" required placeholder="Description du profil"></textarea>
    <div *ngIf="directoryForm.get('description')?.invalid && directoryForm.get('description')?.touched" class="error">
      La description est requise.
    </div>

    <label for="image">Nom du fichier image :</label>
    <input id="image" formControlName="image" placeholder="ex: jean.jpg" />

    <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <button type="submit">Ajouter</button>
  </form>
</div>
