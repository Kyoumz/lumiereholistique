<app-header></app-header>

<!-- Notification message -->
<div *ngIf="message"
     [ngClass]="{'success-msg': messageType === 'success', 'error-msg': messageType === 'error'}"
     class="notification">
  {{ message }}
</div>

<div class="auth-container">
  <div class="form-box">
    <h2>Définir un nouveau mot de passe</h2>
    <form (ngSubmit)="submit()">
      <input type="password" [(ngModel)]="password" name="password" placeholder="Nouveau mot de passe" required />
      <input type="password" [(ngModel)]="confirm" name="confirm" placeholder="Confirmation" required />
      <button type="submit">Réinitialiser</button>
    </form>
    <p>Vous avez déjà un compte ? <a href="/login">Se connecter</a></p>
  </div>
</div>
