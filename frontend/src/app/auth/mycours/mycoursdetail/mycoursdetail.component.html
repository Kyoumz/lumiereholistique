<app-header></app-header>

<main>
  <div class="container" *ngIf="formation">
    <h2>{{ formation.title }}</h2>
    <p>{{ formation.description }}</p>

    <div *ngFor="let chapter of formation.chapters" class="chapter">
      <h4>{{ chapter.title }}</h4>
      <p>{{ chapter.description }}</p>
      <video *ngIf="chapter.video" controls>
        <!-- <source [src]="'http://localhost:5000/' + chapter.video" type="video/mp4" /> -->
        <source [src]="environment.apiUrl + '/' + chapter.video" type="video/mp4" />

        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>
  </div>

  <div class="shape shape1"></div>
  <div class="shape shape2"></div>
  <div class="shape shape3"></div>
</main>
<app-footer></app-footer>
