<app-header></app-header>

<main class="vp-main">
  <h1 class="vp-title">Vidéos & Podcasts</h1>

  <section class="vp-section">
    <h2 class="vp-subtitle">🎥 Vidéos & 🎧 Podcasts</h2>
    <div class="vp-grid">
      <div *ngFor="let video of videos" class="vp-card">
        <iframe
          [src]="'https://www.youtube.com/embed/' + extractYouTubeId(video.video)"
          frameborder="0"
          allowfullscreen
          class="vp-video"
        ></iframe>
        <div class="vp-info">
          <h3>{{ video.title }}</h3>
          <p>{{ video.description }}</p>
        </div>
      </div>
    </div>
  </section>
