<app-header></app-header>

<main class="vp-main">
  <h1 class="vp-title">Vidéos & Podcasts</h1>
  
  <div *ngIf="videosPodcasts.length > 0; else loading">
    <div *ngFor="let video of videosPodcasts" class="vp-item">
      <h2>{{ video.title }}</h2>
      <p>{{ video.description }}</p>
      <p><strong>Thème :</strong> {{ video.themes }}</p>
  
      <video *ngIf="video.file" controls width="600">
        <source [src]="environment.apiUrl + '/' + video.file" type="video/mp4" />
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>
  </div>
  

  <ng-template #loading>
    <p>Chargement des vidéos...</p>
  </ng-template>
</main>

<app-footer></app-footer>
